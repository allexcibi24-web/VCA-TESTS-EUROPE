
name: VCA Tests Europe - iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/VCA-Tests-Europe-iOS-Simulator.zip" App.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: VCA-Tests-Europe-iOS-Simulator
          path: VCA-Tests-Europe-iOS-Simulator.zip
